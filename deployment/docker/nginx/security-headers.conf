# Included in every location that sets headers: nginx drops inherited
# add_header directives as soon as a location defines its own.
# No third-party origins anywhere (CLAUDE.md, data-inventory §1). Angular
# injects component styles at runtime, hence 'unsafe-inline' for styles only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
