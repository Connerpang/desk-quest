worker_processes auto;
pid /tmp/nginx.pid;

# Error-level entries name the client IP, so only critical ones are kept
# (data-inventory: logs keep no IPs). The API logs request failures itself.
error_log /dev/stderr crit;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # No client IPs, query strings, referrers or user agents.
  log_format privacy '$time_iso8601 $request_method $uri $status '
                     '$body_bytes_sent $request_time $request_id';
  access_log /dev/stdout privacy;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Docker's DNS: re-resolve the api container if it restarts with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    include /etc/nginx/security-headers.conf;

    location /api/ {
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      # Same ID in nginx and API logs.
      proxy_set_header X-Request-ID $request_id;
      # Server-sent events (slice 2.5) must not be buffered.
      proxy_buffering off;
    }

    # Hashed bundles never change, so cache them for a year.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
