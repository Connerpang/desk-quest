# Development additions, merged automatically by `docker compose up`.
# Not used on servers (`docker compose -f docker-compose.yml up -d`).
services:
  postgres:
    ports:
      # For `pnpm db:migrate`, `pnpm db:seed` and `pnpm nx serve api`.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  # Catches every outgoing email; nothing is delivered. UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_MAX_MESSAGES: 500
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
